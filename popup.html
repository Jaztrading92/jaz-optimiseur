<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>JAZ Optimiseur</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app">
    <header class="top">
      <button id="menuBtn" class="icon-btn" aria-label="Menu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <img src="icons/icon48.png" class="brand-ic" alt="">
      <div class="ttl"><h1 id="title">Stratégies</h1><div id="stepsBar" class="steps"></div></div>
      <button id="topLink" class="link hidden"></button>
      <nav id="menu" class="menu hidden">
        <button data-go="strategies">📈 Choisir une stratégie</button>
        <button data-go="run" id="menuRun">⚡ Optimisation en cours</button>
        <button data-go="history">🕘 Historique des résultats</button>
        <button data-go="options">⚙️ Options</button>
        <button data-go="newtab">🗗 Ouvrir dans un onglet</button>
        <hr>
        <button data-go="help">❓ Aide</button>
      </nav>
    </header>
    <main id="view"></main>
    <footer class="foot">
      <span class="brand"><img src="icons/logo.png" alt="JAZ Trading FIMC"></span>
      <button id="footAction" class="link hidden"></button>
    </footer>
  </div>
  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
